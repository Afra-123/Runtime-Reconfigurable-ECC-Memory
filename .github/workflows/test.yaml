name: test

on: [push, workflow_dispatch]

jobs:
test:
runs-on: ubuntu-24.04


steps:
  - name: Checkout repo
    uses: actions/checkout@v6
    with:
      submodules: recursive

  - name: Install Verilator 5.036
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y git make autoconf g++ flex bison
      git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/verilator
      cd /tmp/verilator
      autoconf
      ./configure
      make -j$(nproc)
      sudo make install
      verilator --version

  - name: Setup python
    uses: actions/setup-python@v6
    with:
      python-version: '3.11'

  - name: Install Python packages
    shell: bash
    run: pip install -r test/requirements.txt

  - name: Run tests
    run: |
      cd test
      make clean
      make
      ! grep failure results.xml

  - name: Test Summary
    uses: test-summary/action@v2.4
    with:
      paths: "test/results.xml"
    if: always()

  - name: upload waveform and test results
    if: success() || failure()
    uses: actions/upload-artifact@v7
    with:
      name: test-results
      path: |
        test/tb.fst
        test/results.xml
        test/output/*

  name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Verilator
        shell: bash
        run: |
                     sudo apt-get update
                          sudo apt-get install -y git make autoconf g++ flex bison

                             git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/verilator
                               cd /tmp/verilator
                                  autoconf
                                   ./configure
                                     make -j$(nproc)
                                      sudo make install

                                        verilator --version

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
